<main id="views">
<section id="view-home" class="view hidden" aria-label="NXT Ecosystem home"></section>
<section id="view-word" class="view">
<div id="homescreen" class="hs-wrap hidden"></div>
<div id="app">
  <!-- ZONE A: top application bar -->
  <header id="topbar" class="glass">
    <div class="tb-left">
      <button type="button" id="logoBadge" class="logo-badge" title="TXT - File menu" aria-label="Open file menu"><span class="logo-t">T</span></button>
      <button type="button" id="homeBtn" class="icon-btn" title="Start screen" aria-label="Go to start screen"><svg><use href="#i-home"/></svg></button>
      <input id="docTitle" class="doc-title" value="Q4 Product Architecture &amp; Executive Strategy.txtdoc" spellcheck="false" aria-label="Document title">
      <span id="savePill" class="save-pill"><span class="dot"></span><span id="savePillText">Saved to LocalStorage - Just now</span></span>
      <div class="qa-group" role="toolbar" aria-label="Quick access">
        <button type="button" id="qaUndo" class="icon-btn" title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
        <button type="button" id="qaRedo" class="icon-btn" title="Redo (Ctrl+Y)"><svg><use href="#i-redo"/></svg></button>
        <button type="button" id="qaPrint" class="icon-btn" title="Print (Ctrl+P)"><svg><use href="#i-print"/></svg></button>
      </div>
    </div>
    <div class="tb-center">
      <button type="button" id="cmdkBtn" class="cmdk-btn" title="Command palette (Ctrl+K)">
        <svg><use href="#i-search"/></svg><span>Search or command...</span><kbd>Ctrl K</kbd>
      </button>
    </div>
    <div class="tb-right">
      <button type="button" id="goalRing" class="goal-ring" title="Word goal">
        <svg viewBox="0 0 40 40"><circle class="ring-bg" cx="20" cy="20" r="16"/><circle class="ring-fg" id="goalArc" cx="20" cy="20" r="16"/><text x="20" y="24" id="goalPct">0%</text></svg>
      </button>
      <div id="deviceMode" class="segmented" role="tablist" aria-label="Device preview">
        <button type="button" data-device="desktop" class="active" title="Desktop preview"><svg><use href="#i-monitor"/></svg></button>
        <button type="button" data-device="ipad" title="iPad Pro 12.9 preview"><svg><use href="#i-tablet"/></svg></button>
        <button type="button" data-device="mobile" title="iPhone preview"><svg><use href="#i-phone"/></svg></button>
      </div>
      <div id="ribbonMode" class="segmented" role="tablist" aria-label="Ribbon mode">
        <button type="button" data-mode="full" class="active" title="Full classic ribbon">Full</button>
        <button type="button" data-mode="compact" title="Compact single-line bar">Compact</button>
        <button type="button" data-mode="zen" title="Zen distraction-free mode">Zen</button>
      </div>
      <select id="themePicker" class="sel slim" title="Theme" aria-label="Theme">
        <option value="studio">Studio Light</option>
        <option value="obsidian">Obsidian Pro</option>
        <option value="sepia">Editorial Sepia</option>
        <option value="contrast">High Contrast</option>
      </select>
      <button type="button" id="paperToggle" class="icon-btn hidden" title="Toggle white paper in dark mode"><svg><use href="#i-pagecolor"/></svg></button>
      <button type="button" id="btnExportTop" class="btn-primary"><svg><use href="#i-export"/></svg><span>Export</span></button>
    </div>
  </header>

  <!-- ZONE B: smart ribbon -->
  <div id="ribbon" class="glass">
    <div id="ribbonTabs" role="tablist" aria-label="Ribbon tabs"></div>
    <div id="ribbonPanels"></div>
    <button type="button" id="ribbonCollapse" class="collapse-btn" title="Collapse ribbon"><svg><use href="#i-chev-u"/></svg></button>
  </div>
  <div id="pillBar" class="pill-bar glass hidden" role="toolbar" aria-label="Minimal toolbar"></div>

  <!-- zones C/D/E -->
  <div id="workarea">
    <aside id="sidebar">
      <div class="side-tabs" role="tablist">
        <button type="button" data-spane="outline" class="active" title="Outline"><svg><use href="#i-toc"/></svg></button>
        <button type="button" data-spane="pages" title="Page thumbnails"><svg><use href="#i-page"/></svg></button>
        <button type="button" data-spane="find" title="Find and replace"><svg><use href="#i-search"/></svg></button>
      </div>
      <div class="side-body">
        <div id="paneOutline" class="side-pane">
          <input id="outlineSearch" class="side-input" placeholder="Filter headings" aria-label="Filter headings">
          <div id="outlineTree" class="outline-tree"></div>
        </div>
        <div id="panePages" class="side-pane hidden"><div id="thumbList" class="thumb-list"></div></div>
        <div id="paneFind" class="side-pane hidden">
          <input id="findText" class="side-input" placeholder="Find" aria-label="Find">
          <input id="replaceText" class="side-input" placeholder="Replace with" aria-label="Replace with">
          <div class="find-meta"><span id="findCount">No matches</span>
            <button type="button" id="findPrev" class="mini-btn" title="Previous match"><svg><use href="#i-chev-u"/></svg></button>
            <button type="button" id="findNext" class="mini-btn" title="Next match"><svg><use href="#i-chev-d"/></svg></button>
          </div>
          <label class="check"><input type="checkbox" id="matchCase"> Match case</label>
          <label class="check"><input type="checkbox" id="wholeWord"> Whole word</label>
          <div class="find-actions">
            <button type="button" id="replaceOne" class="btn">Replace</button>
            <button type="button" id="replaceAll" class="btn">Replace all</button>
          </div>
        </div>
      </div>
      <button type="button" id="sideCollapse" class="collapse-btn side" title="Collapse sidebar"><svg><use href="#i-chev-r"/></svg></button>
    </aside>

    <main id="stage">
      <div id="rulerH" class="ruler-h"><div id="rulerHTicks" class="ticks"></div>
        <div id="mLeft" class="marker ml" title="Left margin"></div>
        <div id="mFirst" class="marker mf" title="First line indent"></div>
        <div id="mRight" class="marker mr" title="Right margin"></div>
      </div>
      <div class="stage-row">
        <div id="rulerV" class="ruler-v"><div id="rulerVTicks" class="ticks"></div></div>
        <div id="pageScroll">
          <div id="zoomWrap"><div id="pages"></div></div>
        </div>
      </div>
      <div id="floatBar" class="float-bar glass hidden" role="toolbar"></div>
      <div id="slashMenu" class="slash-menu hidden" role="menu"></div>
      <div id="keytips" class="keytips hidden"></div>
      <div id="lineMask" class="line-mask hidden"><div class="slit"></div></div>
      <canvas id="inkLayer" class="ink-layer hidden"></canvas>
      <div id="inkDock" class="ink-dock glass hidden" role="toolbar" aria-label="Ink tools"></div>
    </main>

    <aside id="inspector" class="hidden">
      <div id="inspHead"><span id="inspTitle">Inspector</span>
        <button type="button" id="inspClose" class="icon-btn" title="Close panel"><svg><use href="#i-x"/></svg></button>
      </div>
      <div id="inspBody"></div>
    </aside>
  </div>

  <!-- ZONE F: status bar -->
  <footer id="statusbar">
    <div class="sb-left">
      <button type="button" id="pgInfo" class="sb-btn" title="Page indicator">Page 1 of 1</button>
      <button type="button" id="wcBtn" class="sb-btn" title="Word count details"><span id="wcWords">0 words</span><span class="sep">·</span><span id="wcChars">0 characters</span></button>
      <span id="cursorPos" class="sb-text" title="Cursor position">Ln 1, Col 1</span>
      <button type="button" id="tcBadge" class="sb-badge" title="Toggle track changes">Track Changes: OFF</button>
      <span id="a11yBadge" class="sb-badge ok" title="Accessibility status">Accessibility: Good</span>
    </div>
    <div class="sb-right">
      <div class="seg" role="toolbar" aria-label="View mode">
        <button type="button" id="vwPrint" class="active" title="Print layout"><svg><use href="#i-page"/></svg></button>
        <button type="button" id="vwWeb" title="Web continuous layout"><svg><use href="#i-globe"/></svg></button>
        <button type="button" id="vwImmersive" title="Immersive reader"><svg><use href="#i-eye"/></svg></button>
      </div>
      <button type="button" id="focusBtn" class="sb-btn" title="Focus mode"><svg><use href="#i-focus"/></svg></button>
      <div class="zoom-ctl">
        <button type="button" id="zoomOut" class="icon-btn sm" title="Zoom out"><svg><use href="#i-minus"/></svg></button>
        <input type="range" id="zoomSlider" min="50" max="200" value="100" aria-label="Zoom">
        <button type="button" id="zoomPct" class="sb-btn" title="Reset zoom to 100%">100%</button>
        <button type="button" id="zoomIn" class="icon-btn sm" title="Zoom in"><svg><use href="#i-plus"/></svg></button>
      </div>
    </div>
  </footer>
</div>
