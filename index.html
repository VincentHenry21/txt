<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXT, Word Processor</title>
<meta name="description" content="TXT is a fast word processor that exports to DOC, DOCX, PDF, RTF, TXT, Markdown and HTML.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%234f46e5'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='bold' font-size='30' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">T</span>
    <span class="brand-name">TXT</span>
  </div>
  <input id="docName" class="doc-name" value="Untitled document" spellcheck="false" aria-label="Document name">
  <span id="saveState" class="save-state">Saved</span>
  <div class="topbar-actions">
    <button type="button" id="btnNew" class="tbtn" title="New document">New</button>
    <button type="button" id="btnImport" class="tbtn" title="Open a .txt, .md or .html file">Open</button>
    <div class="menu-wrap">
      <button type="button" id="btnExport" class="tbtn primary" title="Export this document">Export &#9662;</button>
      <div id="exportMenu" class="menu hidden" role="menu">
        <button type="button" data-export="docx" role="menuitem"><span class="ext">DOCX</span><span class="desc">Word document</span></button>
        <button type="button" data-export="doc" role="menuitem"><span class="ext">DOC</span><span class="desc">Word 97 to 2003</span></button>
        <button type="button" data-export="pdf" role="menuitem"><span class="ext">PDF</span><span class="desc">Print to PDF</span></button>
        <button type="button" data-export="odt" role="menuitem"><span class="ext">ODT</span><span class="desc">OpenDocument text</span></button>
        <button type="button" data-export="rtf" role="menuitem"><span class="ext">RTF</span><span class="desc">Rich text format</span></button>
        <button type="button" data-export="html" role="menuitem"><span class="ext">HTML</span><span class="desc">Web page</span></button>
        <button type="button" data-export="md" role="menuitem"><span class="ext">MD</span><span class="desc">Markdown</span></button>
        <button type="button" data-export="txt" role="menuitem"><span class="ext">TXT</span><span class="desc">Plain text</span></button>
      </div>
    </div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="tgroup">
    <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)" class="tool"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button type="button" data-cmd="redo" title="Redo (Ctrl+Y)" class="tool"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div class="tsep"></div>
  <div class="tgroup">
    <select id="fontFamily" class="sel" title="Font" style="width:130px"></select>
    <select id="fontSize" class="sel" title="Font size" style="width:64px"></select>
  </div>
  <div class="tsep"></div>
  <div class="tgroup">
    <button type="button" data-cmd="bold" title="Bold (Ctrl+B)" class="tool"><b>B</b></button>
    <button type="button" data-cmd="italic" title="Italic (Ctrl+I)" class="tool"><i>I</i></button>
    <button type="button" data-cmd="underline" title="Underline (Ctrl+U)" class="tool"><u>U</u></button>
    <button type="button" data-cmd="strikeThrough" title="Strikethrough" class="tool"><s>S</s></button>
    <button type="button" data-cmd="subscript" title="Subscript" class="tool"><span style="font-size:13px">X<sub>2</sub></span></button>
    <button type="button" data-cmd="superscript" title="Superscript" class="tool"><span style="font-size:13px">X<sup>2</sup></span></button>
    <label class="tool color-tool" title="Text color">A<span class="color-bar" id="fgBar"></span><input type="color" id="foreColor" value="#000000" class="hidden-color"></label>
    <label class="tool color-tool" title="Highlight color"><span class="hl-mark">A</span><input type="color" id="hiliteColor" value="#ffff00" class="hidden-color"></label>
    <button type="button" data-cmd="removeFormat" title="Clear formatting" class="tool"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16 12 4l5 12M8.5 12.5h7"/></svg></button>
  </div>
  <div class="tsep"></div>
  <div class="tgroup">
    <select id="blockStyle" class="sel" title="Paragraph style" style="width:104px">
      <option value="p">Normal</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
      <option value="blockquote">Quote</option>
    </select>
    <button type="button" data-cmd="justifyLeft" title="Align left" class="tool"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
    <button type="button" data-cmd="justifyCenter" title="Center" class="tool"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
    <button type="button" data-cmd="justifyRight" title="Align right" class="tool"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
    <button type="button" data-cmd="justifyFull" title="Justify" class="tool"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
  </div>
  <div class="tsep"></div>
  <div class="tgroup">
    <button type="button" data-cmd="insertUnorderedList" title="Bullet list" class="tool"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="6" cy="17" r="1.6"/><path d="M11 7h9M11 12h9M11 17h9"/></svg></button>
    <button type="button" data-cmd="insertOrderedList" title="Numbered list" class="tool"><svg viewBox="0 0 24 24"><path d="M10 7h10M10 12h10M10 17h10"/><text x="3" y="9" font-size="7">1</text><text x="3" y="14" font-size="7">2</text><text x="3" y="19" font-size="7">3</text></svg></button>
    <button type="button" data-cmd="indent" title="Increase indent" class="tool"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 10h16M4 14h16M4 18h10"/><path d="m17 8 3 3-3 3"/></svg></button>
    <button type="button" data-cmd="outdent" title="Decrease indent" class="tool"><svg viewBox="0 0 24 24"><path d="M10 6h10M4 10h16M4 14h16M10 18h10"/><path d="m7 8-3 3 3 3"/></svg></button>
    <select id="lineSpacing" class="sel" title="Line spacing" style="width:62px">
      <option value="1">1.0</option>
      <option value="1.15" selected>1.15</option>
      <option value="1.5">1.5</option>
      <option value="2">2.0</option>
    </select>
  </div>
  <div class="tsep"></div>
  <div class="tgroup">
    <button type="button" id="btnLink" title="Insert link" class="tool"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg></button>
    <button type="button" id="btnImage" title="Insert image" class="tool"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 5-5 3 3 2-2 4 4"/></svg></button>
    <button type="button" id="btnTable" title="Insert table" class="tool"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 10h16M4 14.5h16M12 5v14"/></svg></button>
    <button type="button" data-cmd="insertHorizontalRule" title="Horizontal line" class="tool"><svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg></button>
    <button type="button" id="btnPageBreak" title="Page break" class="tool"><svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M6 9h12M6 15h12"/></svg></button>
  </div>
  <div class="tsep"></div>
  <div class="tgroup">
    <button type="button" id="btnFind" title="Find and replace (Ctrl+F)" class="tool"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/></svg></button>
  </div>
</div>

<div id="findbar" class="findbar hidden">
  <input id="findInput" placeholder="Find" aria-label="Find">
  <input id="replaceInput" placeholder="Replace with" aria-label="Replace with">
  <button type="button" id="findPrev" class="tool" title="Previous">&#8593;</button>
  <button type="button" id="findNext" class="tool" title="Next">&#8595;</button>
  <button type="button" id="replaceOne" class="fbtn" title="Replace current">Replace</button>
  <button type="button" id="replaceAll" class="fbtn" title="Replace all">All</button>
  <span id="findCount" class="find-count"></span>
  <button type="button" id="findClose" class="tool" title="Close">&#10005;</button>
</div>

<main class="workspace">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <span>Documents</span>
      <button type="button" id="btnNewSide" class="mini-btn" title="New document">+</button>
    </div>
    <div id="docList" class="doc-list"></div>
  </aside>
  <section class="canvas" id="canvas">
    <div class="zoom-wrap" id="zoomWrap">
      <article id="sheet" class="sheet" contenteditable="true" spellcheck="true" aria-label="Document editor"></article>
    </div>
  </section>
</main>

<footer class="statusbar">
  <span id="wordCount">0 words</span>
  <span class="sdot">.</span>
  <span id="charCount">0 characters</span>
  <span class="spacer"></span>
  <button type="button" id="btnPageSetup" class="sbtn" title="Page setup">Page setup</button>
  <span class="sdot">.</span>
  <button type="button" id="zoomOut" class="sbtn" title="Zoom out">-</button>
  <select id="zoomSel" class="sel small" title="Zoom">
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1" selected>100%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
  </select>
  <button type="button" id="zoomIn" class="sbtn" title="Zoom in">+</button>
</footer>

<div id="popover" class="popover hidden"></div>
<input type="file" id="importFile" accept=".txt,.md,.markdown,.html,.htm" class="hidden-file">
<input type="file" id="imageFile" accept="image/*" class="hidden-file">

<script src="vendor/docx.iife.js"></script>
<script src="js/convert.js"></script>
<script src="js/docx-export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
